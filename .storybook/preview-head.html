<meta name="robots" content="noindex, nofollow" />
<style>
  /* Docs pages on a phone: the props table's Default and Control columns (an input per prop) made 30 of 34 pages
     wider than the screen, and the page scrolled sideways. Name and Description stay; the same controls, with the
     default values, are in the Controls panel under each story. */
  @media (max-width: 37.5rem) {
    .docblock-argstable th:nth-child(n + 3),
    .docblock-argstable td:nth-child(n + 3) {
      display: none;
    }
  }
  /* Dark mode on a docs page: the page stays Storybook's light one (preview.tsx, withTheme), and each story preview
     gets the dark canvas, so the component shows as on the site and the descriptions stay readable. */
  :root.dark:has(.sbdocs-wrapper),
  :root.dark:has(.sbdocs-wrapper) body {
    background-color: Canvas;
  }
  :root.dark .docs-story {
    background-color: var(--bg-canvas);
    color: var(--text-primary);
    color-scheme: dark;
  }
</style>
<script>
  // A deploy renames the story files and removes the old ones, so a Storybook tab opened before it
  // fails with "Failed to fetch dynamically imported module". Vite reports that as vite:preloadError:
  // reload the preview once to get the new files (at most once in 10 s, so a real error cannot loop).
  window.addEventListener("vite:preloadError", function (event) {
    var key = "kb-storybook-reloaded";
    try {
      var last = Number(sessionStorage.getItem(key) || 0);
      if (Date.now() - last < 10000) return;
      sessionStorage.setItem(key, String(Date.now()));
    } catch (error) {
      return; // no storage: no guard against a loop, so leave the error on screen
    }
    event.preventDefault();
    window.location.reload();
  });
</script>
