# Netlify builds `main` for production (releases only) and `develop` as a branch deploy; see CONTRIBUTING.md.
# Node version comes from .node-version; yarn is detected from yarn.lock.
[build]
  command = "yarn test:run && yarn build"
  publish = "dist"

# Production (main) also builds the component library into dist/storybook, served at /storybook/
# (noindex: public/_headers). Branch deploys skip it to stay fast.
[context.production]
  command = "yarn test:run && yarn build && yarn build-storybook"
